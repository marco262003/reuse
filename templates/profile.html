{% extends "base_app.html" %}
{% load static %}
{% block title %}My profile | REUSE{% endblock %}
{% block page %}profile{% endblock %}
{% block content %}
<h1 class="page-title">MY PROFILE</h1>
<section class="card profile-card" aria-label="Profile details">
  <img class="avatar-lg" id="profile-photo-preview" src="{% static 'img/avatar.svg' %}" alt="Profile picture">
  <form id="profile-photo-form" class="profile-photo-form" enctype="multipart/form-data">
    <label for="profile-photo-input" class="btn btn-outline">Choose profile photo</label>
    <input id="profile-photo-input" name="image" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <p class="muted">JPG, PNG, or WEBP · maximum 5 MB</p>
    <p class="field-error" id="profile-photo-error" role="alert"></p>
    <button class="btn btn-primary" type="submit" id="profile-photo-save" disabled>Save photo</button>
  </form>
  <h2 class="profile-fullname" id="p-name"></h2>
  <p class="profile-type" id="p-type"></p>
  <dl class="profile-fields">
    <div><dt>School Email</dt><dd id="p-email"></dd></div>
    <div><dt>Mobile Number</dt><dd id="p-mobile"></dd></div>
  </dl>
  <button type="button" class="row-btn" id="change-password-btn">Change Password <span aria-hidden="true">&gt;</span></button>
  <button type="button" class="btn btn-primary" id="logout-btn">Log out</button>
</section>
{% endblock %}
{% block scripts %}<script src="{% static 'js/profile.js' %}"></script>{% endblock %}
