<div class="field" data-field="{{ name }}">
  <div class="input-wrap">
    <input class="input has-eye" id="{{ name }}" name="{{ name }}" type="password"
           placeholder="{{ placeholder }}" aria-label="{{ placeholder }}" aria-describedby="{{ name }}-error"
           autocomplete="{{ autocomplete|default:'off' }}">
    <button type="button" class="eye-btn" aria-label="Show password" aria-pressed="false">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.3 17.3 0 0 0 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
    </button>
  </div>
  <p class="field-error" id="{{ name }}-error"></p>
</div>
