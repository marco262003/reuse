{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}REUSE{% endblock %} | REUSE</title>
  <link rel="icon" type="image/png" href="{% static 'img/reuse-logo-maroon.png' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth" data-page="{% block page %}{% endblock %}">
  <main class="authshell">
    <header class="authbrand">
      <img src="{% static 'img/reuse-logo-maroon.png' %}" alt="REUSE logo">
      <h1 class="brandtext">REUSE<small>COMMUNITY RESOURCE SYSTEM</small></h1>
    </header>
    <p class="authtagline">Borrow school equipment and track your returns.</p>
    <section class="authcard {% block card_class %}{% endblock %}">
      <div id="form-alert" class="form-alert" role="alert" hidden></div>
      {% block card %}{% endblock %}
    </section>
  </main>
  <div id="modal-root"></div>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/common.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
