{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}REUSE{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth" data-page="{% block page %}{% endblock %}">
  <main class="auth-shell">
    <h1 class="auth-logo">REUSE</h1>
    <section class="auth-card">
      <div id="form-alert" class="form-alert" role="alert" hidden></div>
      {% block card %}{% endblock %}
    </section>
  </main>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/common.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
